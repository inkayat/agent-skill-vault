# agent-skill-vault catalog
# The single hand-maintained source of truth: sources (provenance/license), entries (curation),
# and vendored (the authoritative inventory of every maintained byte under skills/).
# Nothing here is generated; nothing regenerates from it. Edit, then run `bun test`.
#
# Vocabulary:
#   status:     installed | firstmate_candidate | reference-only | catalog | team-only | restricted
#   activation: auto-candidate | explicit | never
#     invariant: status != firstmate_candidate  =>  activation == never
#                status == firstmate_candidate  =>  activation in {auto-candidate, explicit}
#   scope:      worker | captain | worker+captain
#   auto-candidate = eligible for a deliberate per-task FirstMate pick from a category shortlist,
#     never automatic loading. explicit = only when the task text names the need. Never loaded
#     globally; never registered in ~/.agents/skills or any OMP skills.customDirectories.
#   candidate (status=firstmate_candidate AND activation=auto-candidate) is DERIVED, never stored.
#
# Content model: firstmate-config pins/caches this repo's own root (not any upstream repo).
#   firstmate_candidate AND reference-only rows both carry a real local vault_path, and every
#   vault_path must be a row in `vendored` (which owns that file's source, commit and hash):
#     skills/upstream/<source-id>/<upstream_path>  -- untouched upstream snapshot, byte-identical
#       to the pinned commit.
#     skills/adapted/<...>                         -- a rewritten derivative; the file itself opens
#       with a Source:/Modifications: header (see skills/adapted/README.md).
#   reference-only = explicit-id/captain reference only; NEVER category/auto selection
#     (lookupByCategory only ever returns firstmate_candidate+auto-candidate rows).
#   installed rows have no vault_path; they resolve globally via ~/.agents/skills/<installed_as>.
#   catalog/team-only/restricted rows stay metadata-only: no vault_path, no local body, inert.
#     catalog = unclear/derived-unreviewed rights, OR generated/host-bound/read-prohibitive content
#     deliberately not shipped (upstream_path kept for provenance where it maps to one file).
# ALLOWED_LOOKUP_STATUSES (bin/lib/catalog.ts) = {installed, firstmate_candidate, reference-only}:
# catalog/team-only/restricted rows never surface from a lookup, even by exact id.
